<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Michaël Kangah</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --text: #16181a; --surface: #ffffff; --accent: #1d4ed8; --accent-contrast: #ffffff; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #f1f1ee; --surface: #1a1d20; --accent: #8fb0ff; --accent-contrast: #0b0d10; color-scheme: dark; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1.125rem; line-height: 1.6; color: var(--text);
      background:
        radial-gradient(75% 50% at 15% 8%, #5b8cff 0%, transparent 70%),
        radial-gradient(65% 50% at 95% 38%, #a35cf5 0%, transparent 70%),
        radial-gradient(80% 45% at 40% 100%, #e0507f 0%, transparent 70%),
        #cbd5ff;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(75% 50% at 15% 8%, #1f3f94 0%, transparent 70%),
          radial-gradient(65% 50% at 95% 38%, #5a2a88 0%, transparent 70%),
          radial-gradient(80% 45% at 40% 100%, #7a2a52 0%, transparent 70%),
          #070a14;
      }
    }
    main {
      width: min(30rem, 100%); padding: 2rem; border-radius: 0.8rem;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      border: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 18px 48px rgba(0, 0, 0, 0.25);
      -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
    }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 4vw + 1rem, 2.5rem); line-height: 1.2; }
    p { margin: 0 0 1.25rem; text-wrap: balance; }
    .code { margin: 0 0 0.5rem; font-weight: 700; font-size: 1rem; letter-spacing: 0.04em; }
    a.button {
      display: inline-block; min-height: 44px; padding: 0.7rem 1.4rem; border-radius: 999px;
      background: var(--accent); color: var(--accent-contrast); font-weight: 600; text-decoration: none;
    }
    a.button:hover { filter: brightness(1.08); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 0.25rem; }
    @media (prefers-reduced-transparency: reduce) {
      main { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
    }
    @media (prefers-contrast: more) { main { border: 2px solid currentColor; } }
  </style>
</head>
<body>
  <main id="contenu">
    <p class="code">Erreur 404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être incorrect, ou la page a été déplacée. Tu peux revenir à l'accueil.</p>
    <p><a class="button" href="/">Retour à l'accueil</a></p>
  </main>
</body>
</html>
