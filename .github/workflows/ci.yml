name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: ESLint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Accessibilité (axe)
        run: npm run test:a11y
      - name: Comportement (Playwright)
        run: npm run test:e2e
