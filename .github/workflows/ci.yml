name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur de test (Chrome déjà installé sur le runner, sinon Chromium Playwright)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            for i in 1 2 3; do
              timeout 180 npx playwright install --with-deps chromium && exit 0
              echo "Tentative $i échouée ou bloquée"; sleep 5
            done
            exit 1
          fi
      - name: ESLint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Accessibilité (axe)
        run: npm run test:a11y
      - name: Comportement (Playwright)
        run: npm run test:e2e
      - name: Assemblage du site publié
        run: npm run check:site
